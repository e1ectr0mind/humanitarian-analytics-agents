[project]
name = "haa"
version = "0.1.0"
description = "Humanitarian Analytics Agents — multi-agent data analytics with a hard PII boundary"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "faker>=25.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "rich>=13.7",
    "httpx>=0.27",
    "keyring>=25.0",
    "tomli-w>=1.0",
]

[project.scripts]
haa = "haa.cli.app:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not api and not remote'"
markers = [
    "api: tests that call the Claude API (cost real money; run manually)",
    "remote: tests that call live Kobo/Ona servers (need HAA_TEST_* env; run manually)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
